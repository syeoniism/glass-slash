<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일: 확대/축소 막기(두 번 톡 확대 방지), 노치 영역까지 캔버스로 채우기 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14121f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>유리 베기 (Glass Slash)</title>
  <style>
    /* 글꼴: fonts/ 폴더에 파일이 있으면 그것을, 없으면(GitHub 저장소) 눈누 웹폰트 CDN을 쓴다.
       글꼴 파일은 재배포 불가라 저장소에는 올리지 않음 (README 참고).
       한 굵기만 있으므로 모든 굵기(100~900)에 같은 파일을 써서 가짜 굵게 처리를 막음 */
    @font-face {
      font-family: "SBAggro";               /* 제목 "GLASS SLASH" */
      src: url("fonts/SB_Aggro_B.ttf") format("truetype"),
           url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroB.woff") format("woff");
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: "OkDanDan";              /* 본문 (오케이티콘 Ok단단체) */
      src: url("fonts/OkDanDan-Bold.ttf") format("truetype"),
           url("https://cdn.jsdelivr.net/gh/projectnoonnu/2508-2@1.0/OkDanDan-Bold.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #14121f; overflow: hidden; overscroll-behavior: none; }
    /* 모바일: 길게 눌러 생기는 글자 선택·메뉴, 톡 할 때 생기는 파란 강조 막기 */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }

    /* 모바일 세로 화면 안내: 게임은 16:9 가로 화면이라 세로로 들면 너무 작게 보임 → 가로로 돌리라고 덮어 둠 */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10;
      flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #14121f; color: #f4f1ff; text-align: center;
      font: 22px/1.5 "OkDanDan", sans-serif; padding: 24px; box-sizing: border-box;
    }
    #rotate .phone {
      width: 46px; height: 80px; border: 4px solid #f4f1ff; border-radius: 10px;
      animation: turn 2s ease-in-out infinite;
    }
    #rotate small { color: rgba(244, 241, 255, 0.6); font-size: 16px; }
    @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">
    <div class="phone"></div>
    <div>휴대폰을 가로로 돌려 주세요</div>
    <small>유리 베기는 가로 화면에서 즐길 수 있어요</small>
  </div>

  <!-- 오픈소스 원본 (vendor/, 수정하지 않음) — 전역 Matter, d3, PoissonDiskSampling -->
  <script src="vendor/matter.min.js"></script>
  <script src="vendor/d3-delaunay.min.js"></script>
  <script src="vendor/poisson-disk-sampling.min.js"></script>

  <!-- 직접 작성한 코드 (src/) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>

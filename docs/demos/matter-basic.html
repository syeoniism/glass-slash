<!DOCTYPE html>
<html><body>
<script src="../../vendor/matter.min.js"></script>
<script>
  const { Engine, Render, Runner, Bodies, Composite } = Matter;
  const engine = Engine.create();
  engine.gravity.y = 0.3; // 기본값 1
  const render = Render.create({ element: document.body, engine });
  const boxA = Bodies.rectangle(400, 200, 80, 80);
  const boxB = Bodies.rectangle(450, 50, 80, 80);
  const polygon = Bodies.polygon(400, 100, 6, 50);
  const ground = Bodies.rectangle(400, 610, 810, 60, { isStatic: true });
  Composite.add(engine.world, [boxA, boxB, polygon, ground]);
  Render.run(render);
  Runner.run(Runner.create(), engine);
</script>
</body></html>

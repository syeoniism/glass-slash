<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Matter.js Air Friction 예제</title></head>
<body style="margin:0; font-family:sans-serif">
<p id="result" style="margin:8px 12px; font-size:16px"></p>
<script src="../../vendor/matter.min.js"></script>
<script>
  const { Engine, Render, Runner, Bodies, Body, Composite } = Matter;

  // ① 원본 Air Friction 예제: 공기 저항만 다른 상자 세 개가 떨어진다 (왼쪽일수록 저항이 작아 빨리 떨어짐)
  const engine = Engine.create();
  const render = Render.create({ element: document.body, engine, options: { width: 800, height: 600, showVelocity: true } });
  Composite.add(engine.world, [
    Bodies.rectangle(200, 100, 60, 60, { frictionAir: 0.001 }),
    Bodies.rectangle(400, 100, 60, 60, { frictionAir: 0.05 }),
    Bodies.rectangle(600, 100, 60, 60, { frictionAir: 0.1 }),
    // 벽
    Bodies.rectangle(400, 0, 800, 50, { isStatic: true }),
    Bodies.rectangle(400, 600, 800, 50, { isStatic: true }),
    Bodies.rectangle(800, 300, 50, 600, { isStatic: true }),
    Bodies.rectangle(0, 300, 50, 600, { isStatic: true }),
  ]);
  Render.run(render);
  Runner.run(Runner.create(), engine);

  // ② 바꾼 것: 수치로 비교 — 중력을 끄고 가로 속도 10 px/스텝으로 출발, 1초(60스텝) 뒤 속도
  //    Matter.js는 매 스텝 속도에 (1 − frictionAir)를 곱하므로 이론값은 10 × (1 − frictionAir)^60
  const rows = [0.001, 0.1].map(fa => {
    const e = Engine.create();
    e.gravity.y = 0;
    const b = Bodies.rectangle(0, 0, 60, 60, { frictionAir: fa });
    Composite.add(e.world, b);
    Body.setVelocity(b, { x: 10, y: 0 });
    for (let i = 0; i < 60; i++) Engine.update(e, 1000 / 60);
    return `frictionAir ${fa}: ${b.velocity.x.toFixed(3)} px/스텝 (이론값 ${(10 * (1 - fa) ** 60).toFixed(3)})`;
  });
  document.getElementById('result').textContent = '1초 뒤 가로 속도 — ' + rows.join(' · ');
</script>
</body></html>
